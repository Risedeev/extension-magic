<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rise Lovable</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="app-shell">
        <!-- Top bar -->
        <header class="topbar">
            <div class="brand">
                <img src="icons/logo.png" alt="" class="brand-logo" />
                <span class="brand-name">Rise<br/>Lovable</span>
            </div>
            <div class="topbar-right">
                <span class="pro-badge">PRO</span>
                <button type="button" id="themeToggle" class="icon-btn" title="Alternar tema" aria-label="Alternar tema">
                    <svg id="themeIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
                <button type="button" id="licenseLogoutTop" class="icon-btn" title="Sair" aria-label="Sair">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
                <button type="button" class="icon-btn" title="Minimizar" aria-label="Minimizar">—</button>
            </div>
        </header>

        <!-- Project info (kept, hidden) -->
        <div class="project-info-bar">
            <span id="projectId">Carregando...</span>
        </div>

        <!-- License Gate -->
        <section class="license-gate" id="licenseGate" style="display: none;">
            <div class="license-card">
                <div class="license-hero">
                    <img src="icons/logo.png" alt="" class="license-hero-img" />
                </div>
                <h2 class="license-title">Insira sua licença</h2>
                <p class="license-sub">Insira sua licença</p>

                <form id="licenseForm" class="license-form" autocomplete="off">
                    <input id="licenseKeyInput" type="text" class="license-input" placeholder="LVBL-XXXX-XXXX-XXXX" spellcheck="false" autocapitalize="characters" maxlength="64" />
                    <button type="submit" id="licenseSubmit" class="btn-primary">Validar Licença</button>
                </form>

                <a href="https://riselovable.lovable.app/#plans" target="_blank" rel="noopener" class="btn-outline">
                    <span class="cart-icon" aria-hidden="true">🛒</span>
                    Comprar Licença
                </a>

                <div id="licenseError" class="license-error" style="display:none;"></div>
                <div id="licenseStatus" class="license-status"></div>
            </div>
        </section>

        <!-- License info bar removed; logout handled by top icon button -->
        <div class="license-info-bar" id="licenseInfoBar" style="display:none;" hidden></div>

        <!-- Main chat shell -->
        <div class="chat-shell" id="chatShell" style="display:none;">
            <div class="chat-scroll">
                <!-- User status card -->
                <section class="user-card">
                    <div class="user-card-head">
                        <span class="user-name">User</span>
                        <span class="status-badge">ATIVO</span>
                    </div>
                    <div class="sync-row">
                        <span class="sync-check">✅</span>
                        <span class="sync-text">Sincronizado! Projeto: <span class="sync-project">2566d1...</span></span>
                    </div>
                    <div class="timer-box">
                        <div class="timer-head">
                            <span class="timer-label">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                Licença expira em
                            </span>
                            <span class="timer-value">58:15</span>
                        </div>
                        <div class="timer-bar"><div class="timer-bar-fill"></div></div>
                    </div>
                </section>

                <!-- Tabs -->
                <div class="tabs" role="tablist">
                    <button type="button" class="tab active" data-tab="prompt" role="tab">Prompt</button>
                    <button type="button" class="tab" data-tab="historico" role="tab">Histórico</button>
                </div>

                <!-- Tab: Prompt -->
                <div class="tab-panel" data-panel="prompt">
                    <div class="input-container">
                        <div class="input-wrapper">
                            <textarea id="messageInput" placeholder="Digite seu comando..." rows="4"></textarea>
                        </div>
                        <div class="prompt-toolbar">
                            <label class="toggle-plan">
                                <input type="checkbox" id="modoPlano" />
                                <span class="toggle-track"><span class="toggle-thumb"></span></span>
                                <span class="toggle-label">MODO PLANO</span>
                            </label>
                            <div class="toolbar-actions">
                                <button id="attachButton" type="button" class="tool-btn" title="Anexar arquivo">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                                </button>
                                <input type="file" id="fileInput" multiple accept="image/*,.pdf,.doc,.docx,.txt,.js,.ts,.jsx,.tsx,.json,.css,.html" style="display: none;" />
                                <button id="sendButton" type="button" class="btn-send" title="Enviar mensagem">Enviar</button>
                            </div>
                        </div>
                        <div class="file-preview" id="filePreview" style="display: none;"></div>
                    </div>

                    <!-- Atalhos Rápidos -->
                    <div class="section-title">ATALHOS RÁPIDOS</div>
                    <div class="shortcut-grid">
                        <button type="button" class="shortcut-btn" data-shortcut="bugs"><svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg><span>Bugs</span></button>
                        <button type="button" class="shortcut-btn" data-shortcut="refatorar"><svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg><span>Refatorar</span></button>
                        <button type="button" class="shortcut-btn" data-shortcut="erros"><svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span>Erros</span></button>
                        <button type="button" class="shortcut-btn" data-shortcut="otimizar"><svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg><span>Otimizar</span></button>
                        <button type="button" class="shortcut-btn" data-shortcut="comentarios"><svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Comentários</span></button>
                        <button type="button" class="shortcut-btn" data-shortcut="seo"><svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg><span>SEO</span></button>
                        <button type="button" class="shortcut-btn" data-shortcut="ui"><svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2a10 10 0 0 0 0 20 4 4 0 0 0 0-8 2 2 0 0 1 0-4 6 6 0 0 0 0-8z"/></svg><span>UI</span></button>
                        <button type="button" class="shortcut-btn" data-shortcut="componentes"><svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg><span>Componentes</span></button>
                        <button type="button" class="shortcut-btn" data-shortcut="review"><svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span>Review</span></button>
                    </div>


                    <!-- Ações especiais -->
                    <div class="action-stack">
                        <button type="button" class="action-btn action-crimson">Remover Marca de Água</button>
                        
                        <button type="button" class="action-btn action-red">Usar Chat Padrão</button>
                        <button type="button" class="action-btn action-blue">Baixar Código Fonte</button>
                        
                    </div>
                </div>

                <!-- Tab: Histórico -->
                <div class="tab-panel hidden" data-panel="historico">
                    <div class="messages" id="messages"></div>
                    <div class="history-empty">
                        <div class="empty-bubble">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><circle cx="9" cy="10" r="1" fill="currentColor"/><circle cx="12" cy="10" r="1" fill="currentColor"/><circle cx="15" cy="10" r="1" fill="currentColor"/></svg>
                        </div>
                        <div class="empty-title">Nenhuma mensagem</div>
                        <div class="empty-sub">Seus prompts enviados aparecerão aqui.</div>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <footer class="app-footer">
                <a href="https://wa.me/5561992039398?text=Ol%C3%A1%21%20Tudo%20bem%3F%20Tenho%20algumas%20d%C3%BAvidas%20sobre%20a%20extens%C3%A3o.%20Pode%20me%20ajudar%2C%20por%20favor%3F" target="_blank" rel="noopener noreferrer" class="footer-link">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/></svg>
                    Suporte
                </a>
                <span class="footer-version">v1.3</span>
            </footer>

            <div class="status-bar" id="statusBar"></div>
            <div id="chatContainer" style="display:none;"></div>
        </div>
    </div>

    <script src="vendor/jszip.min.js"></script>
    <script src="branding.js"></script>
    <script src="license.js"></script>
    <script src="popup.js"></script>
    <script src="history.js"></script>
    <script src="ui-extras.js"></script>
</body>
</html>
